[package]
name = "helio-strap"
version = "1.0.0"
edition = "2024"
description = "Bluetooth helper for the Helio Strap Omarchy plugin: heart rate, steps and sleep from an Amazfit Helio Strap"
license = "MIT"
repository = "https://github.com/lorismaz/omarchy-helio-strap"
publish = false

[dependencies]
aes = "0.9.4"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = "0.4.45"
crc32fast = "1.5.5"
futures = "0.3.34"
getrandom = "0.4.3"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "sync", "io-util"] }
ureq = "3.5.2"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
