# Builds the ebb-strap helper for x86_64 and aarch64 and attaches the
# binaries (and their SHA-256) to the GitHub release for a tag. The plugin's
# install-helper.sh pins those checksums, so assets are never replaced.
name: Release helper

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, like v1.0.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --locked --manifest-path helper/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path helper/Cargo.toml
      - name: Package
        run: |
          name="ebb-strap-${TAG#v}-${{ matrix.arch }}-linux"
          mkdir dist
          cp helper/target/release/ebb-strap "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          file "dist/$name"
          cat "dist/$name.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ebb-strap-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          ls -la dist
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Ebb $TAG" \
              --notes "Bluetooth helper binaries for Ebb, the Omarchy plugin for the Amazfit Helio Strap. The panel's Install helper button downloads the one for your machine and checks its SHA-256 against the value pinned in the plugin."
          fi
          # No --clobber: once published, a binary is never replaced (its checksum is pinned).
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY"
